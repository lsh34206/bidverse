# BidVerse nginx 설정 — EC2 Ubuntu 기준
#
# 설치:
#   sudo apt install -y nginx
#   sudo cp deploy/nginx/bidverse.conf /etc/nginx/sites-available/bidverse
#   sudo ln -s /etc/nginx/sites-available/bidverse /etc/nginx/sites-enabled/bidverse
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (도메인 연결 후):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d bidverse.example.com
#   -> 443 블록과 80 -> 443 리다이렉트를 certbot이 자동으로 추가한다.
#
# 아래 server_name 과 root 경로를 실제 값으로 바꿀 것.
# EC2 보안 그룹은 80/443만 열고, 백엔드 포트(3000)는 외부에 열지 않는다.

# WebSocket 업그레이드 요청이면 Connection: upgrade, 아니면 close
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 백엔드 인스턴스 목록. 기본은 1개.
# 여러 개로 늘릴 때 (API_INSTANCES=3 pm2 start ecosystem.config.cjs, backend/.env 에 REDIS_URL 필수):
#   아래 server 줄을 포트별로 늘리고 least_conn 주석을 푼다.
#   Socket.IO는 클라이언트가 websocket 전용으로 붙으므로 sticky session(ip_hash)은 필요 없다.
upstream bidverse_api {
    # least_conn;
    server 127.0.0.1:3000;
    # server 127.0.0.1:3001;
    # server 127.0.0.1:3002;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name bidverse.example.com;

    # Vite 빌드 결과물 (frontend/dist)
    root /var/www/bidverse/frontend/dist;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # REST API
    location /api/ {
        proxy_pass http://bidverse_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.IO (실시간 입찰). WebSocket 업그레이드 헤더가 반드시 필요하다.
    location /socket.io/ {
        proxy_pass http://bidverse_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 연결을 오래 유지하므로 기본 60초 타임아웃에 끊기지 않게 한다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 해시가 붙은 정적 파일은 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 은 캐시하지 않는다 (배포 직후 새 번들을 바로 받게)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA 라우팅: 없는 경로는 index.html 로
    location / {
        try_files $uri $uri/ /index.html;
    }
}
